# Lint, type-check, test and format check on every push / PR (LLD §5.4).
# No secrets are used. The rules job runs the Firestore emulator with a demo project.
name: CI

on:
  push:
    branches: [main, 'release1/**', 'feat/**']
  pull_request:
    branches: [main, 'release1/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test (core coverage gate ≥ 90 %, app)
        run: npm test

      - name: Format check
        run: npm run format:check

  rules:
    # Firestore security rules against the emulator (LLD §1.13). Uses a demo project: no credentials.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install
        run: npm ci && npm install -g firebase-tools@15

      - name: Firestore rules tests
        run: npm run test:rules
