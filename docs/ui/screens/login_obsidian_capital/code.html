 "micro-badge": ["Inter"], "body-md": ["Inter"], "display-hero": ["Inter"], "metric-num-md": ["Inter"], "metric-num-lg": ["Inter"], "headline-sm": ["Inter"], "label-sm": ["Inter"], "headline-lg": ["Inter"], "body-lg": ["Inter"], "label-md": ["Inter"], "headline-md": ["Inter"] }, "fontSize": { "micro-badge": ["10px", { "lineHeight": "12px", "letterSpacing": "0.04em", "fontWeight": "600" }], "body-md": ["13px", { "lineHeight": "18px", "letterSpacing": "0em", "fontWeight": "400" }], "display-hero": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.03em", "fontWeight": "700" }], "metric-num-md": ["16px", { "lineHeight": "20px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "metric-num-lg": ["24px", { "lineHeight": "28px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "headline-sm": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500" }], "headline-lg": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "body-lg": ["15px", { "lineHeight": "22px", "letterSpacing": "0em", "fontWeight": "400" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }], "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.015em", "fontWeight": "600" }] } } } };</script><style>@layer base { html, body { width: 100vw; margin: 0; padding: 0; } body { overscroll-behavior: none; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; }</style></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased min-h-screen flex flex-col justify-between selection:bg-primary-container selection:text-on-primary-container"><main class="flex-1 flex flex-col relative w-full bg-surface pt-safe pb-safe"><div class="flex flex-col w-full px-space-lg pb-space-xl">
<!-- 1. Top Security Status Badge -->
<div class="flex items-center justify-center pt-space-xs pb-space-md">

</div>
<!-- 2. Hero Section: Logo, Headlines & Dual-Market Trust Chip -->
<div class="flex flex-col items-center text-center mt-space-xs mb-space-lg">
<!-- App Crest / Logo -->
<div class="relative flex items-center justify-center w-14 h-14 rounded-xl bg-surface-container-high shadow-md mb-space-md overflow-hidden group">
<div class="absolute inset-0 bg-gradient-to-tr from-primary/10 via-transparent to-primary/20"></div>
<svg class="w-8 h-8 text-primary relative z-10" fill="none" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
<path d="M6 24L13 14L18 19L26 8" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
<path d="M20 8H26V14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
<circle cx="6" cy="24" fill="currentColor" r="2"></circle>
<circle cx="13" cy="14" fill="currentColor" r="2"></circle>
<circle cx="18" cy="19" fill="currentColor" r="2"></circle>
<circle cx="26" cy="8" fill="currentColor" r="2.5"></circle>
</svg>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight mb-1">
      Welcome back
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
      Sign in to track your global assets &amp; dual-market exposure
    </p>
<!-- Dual-Market Trust Chip -->

</div>
<!-- Form Container -->
<form class="flex flex-col gap-space-md w-full" id="auth-form" onsubmit="event.preventDefault();">
<!-- Field 1: Email Address -->
<div class="flex flex-col gap-1.5 text-left">
<label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="email">
<span class="">Email Address</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Corporate or Retail</span>
</label>
<div class="relative flex items-center w-full rounded-xl bg-surface-container-low focus-within:bg-surface-container focus-within:ring-1 focus-within:ring-primary transition-all">
<div class="absolute left-3.5 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input autocomplete="email" class="w-full h-[52px] bg-transparent pl-11 pr-4 text-on-surface placeholder:text-outline-variant font-body-lg text-body-lg focus:outline-none rounded-xl" id="email" placeholder="name@example.com" required="" type="email">
</div>
</div>
<!-- Field 2: Password -->
<div class="flex flex-col gap-1.5 text-left">
<label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="password">
<span class="">Password</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Secure Vault Key</span>
</label>
<div class="relative flex items-center w-full rounded-xl bg-surface-container-low focus-within:bg-surface-container focus-within:ring-1 focus-within:ring-primary transition-all">
<div class="absolute left-3.5 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input autocomplete="current-password" class="w-full h-[52px] bg-transparent pl-11 pr-12 text-on-surface placeholder:text-outline-variant font-body-lg text-body-lg tracking-widest focus:outline-none rounded-xl" id="password" placeholder="••••••••••••" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-3 p-1.5 flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors rounded-lg active:scale-95" id="toggle-password-btn" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwd-icon">visibility</span>
</button>
</div>
</div>
<!-- 4. Remember & Forgot Password -->
<div class="flex items-center justify-between pt-0.5 pb-1">
<label class="flex items-center gap-2 cursor-pointer select-none">
<input checked="" class="w-4 h-4 rounded bg-surface-container text-primary-container accent-primary-container focus:ring-0 cursor-pointer" type="checkbox">
<span class="font-body-md text-body-md text-on-surface-variant">Remember this device</span>
</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed transition-colors" href="#forgot">
        Forgot Password?
      </a>
</div>
<!-- 5. Primary Action Button -->
<button class="w-full h-[52px] rounded-xl bg-primary-container hover:bg-primary text-on-primary-container font-headline-sm text-headline-sm flex items-center justify-center gap-2 active:scale-[0.99] transition-all shadow-md mt-1" id="login-btn" type="submit">
<span class="">Log In to Vault</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- 6. Biometric Quick-Pass Button -->
<div class="mt-space-md flex flex-col items-center">
<button class="w-full h-[50px] rounded-xl bg-surface-container hover:bg-surface-container-high text-on-surface font-label-md text-label-md flex items-center justify-center gap-2.5 transition-all active:scale-[0.99]" id="faceid-btn" type="button">
<span class="material-symbols-outlined text-primary text-[22px]">fingerprint</span>
<span class="">Quick sign-in with Face ID / Touch ID</span>
</button>
</div>
<!-- 7. Structural Divider -->
<div class="relative flex items-center justify-center my-space-lg">
<div class="w-full h-px bg-surface-container-high"></div>
<span class="absolute px-3 bg-surface text-on-surface-variant font-micro-badge text-micro-badge tracking-widest uppercase">
      OR
    </span>
</div>
<!-- 8. Social Auth: Continue with Google -->
<div class="flex flex-col gap-space-sm">
<button class="w-full h-[52px] rounded-xl bg-surface-container-low hover:bg-surface-container text-on-surface font-label-md text-label-md flex items-center justify-center gap-3 transition-all active:scale-[0.99]" type="button">
<!-- Official Google 'G' Mark SVG -->
<svg class="w-5 h-5" viewBox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3h3.86c2.26-2.09 3.68-5.17 3.68-9.09z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.37 24 12 24z" fill="#34A853"></path>
<path d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.61H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.39l3.98-3.1z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.37 0 3.26 2.7 1.29 6.61l3.98 3.1c.95-2.85 3.6-4.96 6.73-4.96z" fill="#EA4335"></path>
</svg>
<span class="">Continue with Google</span>
</button>
</div>
<!-- 9. Footer: Signup & Compliance Footnote -->
<div class="mt-space-xl flex flex-col items-center text-center gap-space-md">
<p class="font-body-md text-body-md text-on-surface-variant">
      Don't have an account?
      <a class="font-semibold text-primary hover:text-primary-fixed ml-1 transition-colors" href="#register">
        Sign up
      </a>
</p>
<div class="flex items-center justify-center gap-1.5 text-on-surface-variant font-label-sm text-label-sm max-w-xs">
<span class="material-symbols-outlined text-[15px] text-primary" style="font-variation-settings: 'FILL' 1;">shield</span>
<span class="">Protected by Biometric Passkey</span>
</div>
</div>
</div>
<script>
  (function () {
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-password-btn');
    const pwdIcon = document.getElementById('pwd-icon');

    if (toggleBtn && passwordInput && pwdIcon) {
      toggleBtn.addEventListener('click', function () {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        if (isPassword) {
          passwordInput.setAttribute('type', 'text');
          passwordInput.classList.remove('tracking-widest');
          pwdIcon.textContent = 'visibility_off';
        } else {
          passwordInput.setAttribute('type', 'password');
          passwordInput.classList.add('tracking-widest');
          pwdIcon.textContent = 'visibility';
        }
      });
    }

    const faceIdBtn = document.getElementById('faceid-btn');
    if (faceIdBtn) {
      faceIdBtn.addEventListener('click', function () {
        const originalContent = faceIdBtn.innerHTML;
        faceIdBtn.innerHTML = `
          <span class="material-symbols-outlined text-primary text-[22px] animate-spin">refresh</span>
          <span>Authenticating Vault Biometrics...</span>
        `;
        setTimeout(() => {
          faceIdBtn.innerHTML = `
            <span class="material-symbols-outlined text-primary text-[22px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
            <span class="text-primary font-semibold">Biometrics Verified</span>
          `;
          setTimeout(() => {
            faceIdBtn.innerHTML = originalContent;
          }, 2000);
        }, 1200);
      });
    }
  })();
</script></main>

</body></html>
